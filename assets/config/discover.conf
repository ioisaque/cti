; Configuração da varredura de estações do laboratório
; subnet_prefix vazio = detecta automaticamente pela interface de rede do Mac
; projects: subpastas desta pasta CTI (ex.: projects/aluno/meuprojeto)

ports = 80 8080
timeout = 2
require_apache_header = 0
scan_start = 1
scan_end = 254
local_hostname = isaque.local
local_hub_hosts = professor.local isaque.local
discover_admin_hosts = isaque.local professor.local
projects_max_depth = 5
projects_skip_dirs = assets .git node_modules vendor
